name: Weekly Master Refresh

# refresh_master_data.py's docstring says "Run by weekly_master_refresh.yml
# every Sunday" — but that workflow was never created, so EQUITY_L and the
# sector/cap master in the master_data table have only ever been updated by
# hand. New listings and index reshuffles quietly go missing without it.
#
# Sunday 09:00 IST = 03:30 UTC Sunday.

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

concurrency:
  group: master-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh master data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_master_data.py
