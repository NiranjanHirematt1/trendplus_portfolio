name: Daily Engine Run

# ─────────────────────────────────────────────────────────────────────
# 17:17 / 18:17 / 19:17 IST  =  11:47 / 12:47 / 13:47 UTC.
# Cron here is UTC. At those hours the IST date still equals the UTC date,
# so there is no date rollover to worry about.
#
# Why :17 and not :00 — GitHub queues every scheduled workflow on the planet,
# and the queue is worst at :00 and :30 past the hour. Runs there are routinely
# delayed 20-40 minutes and are the first to be dropped under load. An odd
# minute gets picked up far closer to on time.
#
# Every run does the same thing:
#   1. latest = newest 'done' date in Supabase
#   2. download today's bhavcopy and read the date INSIDE the file
#   3. file date > latest → load + compute under the file's date
#      otherwise (holiday, stale file, already loaded) → exit 0, write nothing
# On a holiday NSE may serve the previous session's file under today's URL,
# so the file's own date is the only thing trusted. The 18:17 / 19:17 runs
# are automatic retries if NSE was late, and instant no-ops once loaded.
#
# No catch-up sweep. To load a day that was missed, run this workflow
# manually with trade_date=YYYY-MM-DD.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '47 11 * * 1-5'      # 17:17 IST
    - cron: '47 12 * * 1-5'      # 18:17 IST
    - cron: '47 13 * * 1-5'      # 19:17 IST
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Backfill one date YYYY-MM-DD (blank = normal daily run)'
        required: false
        default: ''
      force:
        description: 'Recompute even if the date is already done'
        type: boolean
        required: false
        default: false

# Never let two runs write price_history for the same day at once.
concurrency:
  group: daily-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run engine
        env:
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          # Use the `inputs` context, not `github.event.inputs`. The latter is
          # always a string, so `github.event.inputs.force == true` compares
          # 'true' to a boolean, which GitHub coerces to NaN — always false.
          # `inputs` respects the declared type, and is empty on schedule runs.
          TRADE_DATE:    ${{ inputs.trade_date }}
          FORCE_RUN:     ${{ inputs.force && '1' || '' }}
          NSE_ATTEMPTS:  '4'
          NSE_WAIT_SECS: '90'
        run: python scripts/run_engine_cli.py

      # Safety net only. run_engine_cli.py already records its own errors in
      # market_calendar; this catches the case where it died before it could
      # (bad import, missing dependency, runner killed, no DATABASE_URL).
      - name: Record failure in market_calendar
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADE_DATE:   ${{ inputs.trade_date }}
        run: |
          python - <<'EOF'
          import asyncio, datetime, os, asyncpg

          dsn = os.environ.get("DATABASE_URL", "")
          if not dsn:
              print("DATABASE_URL is not set — cannot record the failure. "
                    "Add it under Settings > Secrets and variables > Actions.")
              raise SystemExit(0)

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          override = os.environ.get("TRADE_DATE", "").strip()
          day = (datetime.date.fromisoformat(override) if override
                 else datetime.datetime.now(IST).date())
          run_url = (f"{os.environ.get('GITHUB_SERVER_URL','')}/"
                     f"{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/"
                     f"{os.environ.get('GITHUB_RUN_ID','')}")

          async def mark():
              pool = await asyncpg.create_pool(dsn, min_size=1, max_size=2)
              async with pool.acquire() as conn:
                  # Don't clobber a more specific message the script already wrote.
                  await conn.execute(
                      """
                      insert into market_calendar
                          (trade_date, engine_status, error_message)
                      values ($1, 'error', $2)
                      on conflict (trade_date) do update set
                          engine_status = 'error',
                          error_message = coalesce(
                              nullif(market_calendar.error_message, ''),
                              excluded.error_message)
                      """,
                      day, f"GitHub Actions job failed — {run_url}",
                  )
              await pool.close()

          asyncio.run(mark())
          EOF
